[workspace]
authors = [
    "Adele Jordan <ajae2021@mymail.pomona.edu>",
    "Keeney <nkeeney@hurricaneisland.net>",
    "Madeleine Regulla <mjrw2808@icloud.com>"
]
channels = ["conda-forge"]
name = "scallop-stable-isotope-analysis"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

[tasks]
isotopes = "python cli.py"
test = "pytest --verbose"
docs = "sphinx-build -E docs www"
docs-incremental = "sphinx-build docs www"

[dependencies]
pandas = ">=3.0.3,<4"
python = ">=3.14.6,<3.15"
matplotlib = ">=3.11.1,<4"
scikit-learn = ">=1.9.0,<2"
plotly = ">=6.9.0,<7"
numpy = ">=2.5.1,<3"
openpyxl = ">=3.1.5,<4"
statsmodels = ">=0.14.6,<0.15"
scipy = ">=1.18.0,<2"
seaborn = ">=0.13.2,<0.14"
black = ">=26.5.1,<27"
click = ">=8.4.2,<9"
pytest = ">=9.1.1,<10"

[pypi-dependencies]
prince = ">=0.20.1, <0.21"
sphinx = ">=9.1.0, <10"
sphinx-click = ">=6.2.0, <7"

